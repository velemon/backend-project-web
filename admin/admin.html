<!-- Admin panel -->
<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <title>Admin panel | Seoul Crunch</title>
</head>

<!-- Admin panel för att hantera menyobjekt, endast för administratörer -->
<body class="admin-body">

    <!-- Nav -->
    <nav>
        <div class="logo">ADMIN PANEL</div>
        <button onclick="logout()">Logout</button>
    </nav>

    <!-- Main content -->
    <main class="admin">

        <h1>Menyhantering</h1>

        <!-- Form för att skapa nytt menyobjekt -->
        <div class="form">
            <input id="name" placeholder="Namn">
            <input id="description" placeholder="Beskrivning">
            <input id="marinade" placeholder="Marinad">
            <input id="price" placeholder="Pris">
            <button onclick="createDish()">Skapa</button>
            <p id="createError" class="error"></p>
        </div>
        <div id="menu"></div>
    </main>

    <!-- Edit box -->
    <div id="editBox" class="edit-box hidden">

        <h2>Edit dish</h2>

        <input id="editName" placeholder="Name">
        <input id="editDescription" placeholder="Description">
        <input id="editMarinade" placeholder="Marinade">
        <input id="editPrice" placeholder="Price">

        <button onclick="saveEdit()">Save</button>
        <button onclick="closeEdit()">Cancel</button>

    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="../js/admin.js"></script>

    </body>

</html>
